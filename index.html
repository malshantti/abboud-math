<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
/* روابط قديمة (#/lesson/...) كانت على الجذر: نحوّلها إلى موقع رياضيات الصف الثامن الجديد */
(function(){var h=location.hash||'';if(/^#\/[a-z]/i.test(h)){location.replace('g8/math/'+location.search+h);}})();
try{document.documentElement.dataset.theme=localStorage.getItem('abboud_theme')||'light'}catch(e){}
</script>
<meta name="theme-color" content="#647b43">
<meta name="description" content="بستان التعلّم مع زيتون: اختر صفك ومادتك وتعلّم دروس المنهاج الفلسطيني خطوة بخطوة.">
<title>بستان التعلّم — اختر صفك ومادتك</title>
<link rel="icon" href="assets/img/zaytoun-welcome.webp">
<link rel="preload" href="assets/fonts/baloo-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="entry.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
<a class="skip" href="#main">انتقل إلى المحتوى</a>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="./" aria-label="بستان التعلّم">
      <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z" fill="currentColor"/><path d="M5 19c4-4 7-7 10-11" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      <span>بستان التعلّم<small>نزرع الفهم، ونحصد المعرفة</small></span>
    </a>
    <button class="iconbtn" id="theme" type="button" aria-label="تبديل الوضع الليلي"></button>
  </header>
  <main id="main" tabindex="-1">
    <section class="hero">
      <div>
        <h1 id="hello">أهلًا بك في البستان</h1>
        <p>اختر صفّك ثم مادتك، وزيتون يرافقك في كل خطوة.</p>
      </div>
      <img src="assets/img/zaytoun-welcome.webp" alt="زيتون يرحّب بك" width="150" height="176">
    </section>
    <section id="resume" class="resume hidden" aria-live="polite"></section>
    <div class="name">
      <label for="sname">اسمك (اختياري)</label>
      <input id="sname" type="text" maxlength="24" autocomplete="given-name" placeholder="مثلًا: عبّود">
    </div>
    <div class="step" id="s1h"><span class="n">١</span><div><h2>اختر الصف</h2><p>من الصف الأول حتى الثاني عشر</p></div></div>
    <div class="grid grades" id="grades" role="group" aria-labelledby="s1h"></div>
    <div class="step off" id="s2h"><span class="n">٢</span><div><h2 id="s2t">اختر المادة</h2><p id="s2p">اختر الصف أولًا</p></div></div>
    <div class="grid subjects" id="subjects" role="group" aria-labelledby="s2h"></div>
  </main>
  <p class="foot">المنهاج الفلسطيني · نضيف صفوفًا ومواد جديدة تباعًا</p>
</div>
<script src="catalog.js"></script>
<script src="entry.js"></script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body>
</html>
