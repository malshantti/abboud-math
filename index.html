<script>
/* روابط قديمة (#/lesson/...) كانت على الجذر: نحوّلها إلى موقع رياضيات الصف الثامن الجديد */
(function(){var h=location.hash||'';if(/^#\/[a-z]/i.test(h)){location.replace('g8/math/'+location.search+h);}})();
/* لا دخول دون ملف طالب */
(function(){try{var s=JSON.parse(localStorage.getItem('bustan_session')||'null');if(!s||s.pending||localStorage.getItem('bustan_owner')!==s.id){location.replace('login.html');}}catch(e){}})();
try{document.documentElement.dataset.theme=localStorage.getItem('abboud_theme')||'light'}catch(e){}
</script>

<a class="skip" href="#main">انتقل إلى المحتوى</a>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="./" aria-label="بستان التعلّم">
      <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z" fill="currentColor"/><path d="M5 19c4-4 7-7 10-11" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>

  <main id="main" tabindex="-1">
    <section class="hero">
      <div>
        <h1 id="hello">أهلًا بك في البستان</h1>

    <div class="userbar" id="userbar"></div>
    <div class="step" id="s1h"><span class="n">١</span><div><h2>اختر الصف</h2><p>من الصف الأول حتى الثاني عشر</p></div></div>

    <div class="step off" id="s2h"><span class="n">٢</span><div><h2 id="s2t">اختر المادة</h2><p id="s2p">اختر الصف أولًا</p></div></div>
    <div class="grid subjects" id="subjects" role="group" aria-labelledby="s2h"></div>
  </main>
  <p class="foot">المنهاج الفلسطيني · نضيف صفوفًا ومواد جديدة تباعًا</p>
